<main class="container">
  <header class="cabecalho">
    <h1>Catálogo de livros</h1>
    <a class="botao" routerLink="/livros/novo">
      + Novo livro
    </a>
  </header>

  <app-filtro-livros
    [pesquisa]="pesquisa()"
    [status]="filtroStatus()"
    (pesquisaChange)="atualizarPesquisa($event)"
    (statusChange)="atualizarStatus($event)"
  />

  <app-lista-livros
    [livros]="livrosFiltrados()"
    [carregando]="carregando()"
    [erro]="erro()"
  />
</main>
